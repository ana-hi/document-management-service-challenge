services:
  postgresql:
    container_name: postgresql_container
    image: bitnami/postgresql:15.4.0
    ports:
      - "5432:5432"
    networks:
      - batch_network
    volumes:
      - challenge_postgresql_data:/bitnami/postgresql
      - ./init-scripts:/docker-entrypoint-initdb.d
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=document_schema
      - POSTGRESQL_POSTGRES_PASSWORD=postgres # Password of user "postgres"
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: always
    ports:
      - "9000:9000"  # API S3
      - "9001:9001"  # MinIO Web Console
    networks:
      - batch_network
    environment:
      MINIO_ROOT_USER: miniouser
      MINIO_ROOT_PASSWORD: miniopass
      MINIO_ACCESS_KEY: "Ii3vSQ0sZrM7nZeVjGwV"
      MINIO_SECRET_KEY: "ywzG4bcabqgt0UzKjCeKwUtXcpH0WHFYi7Ocis4u"
    command: server --console-address ":9001" /data
    volumes:
      - challenge_minio_data:/data
  document-management-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: document_management_service
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Xmx50m -Xms50m
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      - postgresql
      - minio
    networks:
      - batch_network

volumes:
  challenge_postgresql_data:
    driver: local
  challenge_minio_data:
    driver: local

networks:
  batch_network:
    driver: bridge
